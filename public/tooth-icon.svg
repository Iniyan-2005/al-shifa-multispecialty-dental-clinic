<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Royal Deep Cyan -->
    <linearGradient id="alShifaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072b3b"/>
      <stop offset="50%" stop-color="#0c4a60"/>
      <stop offset="100%" stop-color="#083444"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="alShifaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Tooth Glow / Shine Gradient -->
    <linearGradient id="toothShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#alShifaBg)"/>
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="url(#alShifaGold)" stroke-width="1.8" stroke-dasharray="80 5 15 5" opacity="0.85"/>

  <!-- Golden Healing Crescent / Smile Arc (Symbolizing "Al-Shifa" Healing) -->
  <path d="M 18,52 C 18,72 34,86 52,86 C 70,86 84,73 84,55 C 84,48 81,42 77,37 C 76,38 77,41 77,44 C 77,61 64,75 48,75 C 33,75 22,64 22,48 C 22,43 23,38 25,34 C 20,39 18,45 18,52 Z" 
        fill="url(#alShifaGold)" opacity="0.95" />

  <!-- Stylized Elegant Molar Tooth -->
  <g filter="url(#logoShadow)">
    <path d="M 50,25 
             C 53.5,23 61,22.5 67,26 
             C 73,29.5 75.5,37 74,45 
             C 72.5,52.5 70,64 65,72 
             C 62,76.5 57.5,74.5 55,67 
             C 53.5,62.5 52,58 50,58 
             C 48,58 46.5,62.5 45,67 
             C 42.5,74.5 38,76.5 35,72 
             C 30,64 27.5,52.5 26,45 
             C 24.5,37 27,29.5 33,26 
             C 39,22.5 46.5,23 50,25 Z" 
          fill="url(#toothShine)"/>

    <!-- Tooth Crown Gloss Highlight -->
    <path d="M 35,28 C 38,26 43,26 48,27 C 44,29 39,32 35,36 C 33,33 33.5,30 35,28 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Medical / Healing Plus Cross in Gold on the Tooth -->
    <g transform="translate(50, 42)">
      <rect x="-2" y="-6.5" width="4" height="13" rx="1.5" fill="url(#alShifaGold)"/>
      <rect x="-6.5" y="-2" width="13" height="4" rx="1.5" fill="url(#alShifaGold)"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Sparkle of Radiance at top right -->
  <path d="M 74,20 Q 74,25 79,25 Q 74,25 74,30 Q 74,25 69,25 Q 74,25 74,20 Z" fill="url(#alShifaGold)"/>
  <circle cx="74" cy="25" r="1" fill="#ffffff"/>
</svg>
